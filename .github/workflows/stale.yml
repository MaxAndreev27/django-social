name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '30 1 * * *'  # Run at 1:30 AM UTC daily

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v11
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: |
          This issue has been automatically marked as stale because it has not had recent activity.
          It will be closed in 7 days if no further activity occurs.
          
          If you believe this issue is still relevant, please comment to keep it open.
        stale-pr-message: |
          This pull request has been automatically marked as stale because it has not had recent activity.
          It will be closed in 7 days if no further activity occurs.
          
          If you believe this PR is still relevant, please comment to keep it open.
        close-issue-message: 'Closing due to inactivity.'
        close-pr-message: 'Closing due to inactivity.'
        
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
        
        days-before-issue-stale: 30
        days-before-pr-stale: 14
        days-before-close: 7
        
        exempt-issue-labels: 'pinned,security,bug'
        exempt-pr-labels: 'pinned,security'
        exempt-all-milestones: false
        
        operations-per-run: 30
