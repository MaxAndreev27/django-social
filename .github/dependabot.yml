version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "MaxAndreev27"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "⬆️ deps:"
      prefix-development: "⬆️ deps(dev):"
      include: "scope"
    allow:
      - dependency-type: "all"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
    reviewers:
      - "MaxAndreev27"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "⬆️ ci:"
