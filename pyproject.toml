[project]
name = "django-social"
version = "0.1.0"
description = "Social website built with Django"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-debug-toolbar>=8.0.0",
    "easy-thumbnails>=2.10.1",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "social-auth-app-django>=6.0.1,<7",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "coverage>=7.0",
    "flake8>=7.0",
    "isort>=5.13",
]

[tool.uv]
package = false

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
